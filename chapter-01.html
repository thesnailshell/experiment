<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Эксперимент. Глава 1. Фэнтези и LitRPG.">
  <title>Глава 1 — Эксперимент</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chapter-text {
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-size: 1.08rem;
      line-height: 1.8;
    }
    .chapter-text p {
      margin: 0 0 1rem;
    }
    .chapter-text .scene-break {
      text-align: center;
      margin: 1.8rem 0;
    }
    .chapter-nav {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 2rem 0;
    }
    .chapter-nav a {
      text-decoration: none;
    }
    @media (max-width: 600px) {
      .chapter-text {
        font-size: 1rem;
        line-height: 1.75;
        padding: 0 1.1rem;
      }
    }
  </style>
</head>
<body>

  <main class="container page-main">
    <div class="chapter-text">

      <p><a href="index.html">← На главную</a> ·
      <a href="chapters.html">Все главы</a></p>

      <h1>Эксперимент</h1>
      <div id="chapter-text" class="chapter-text">Загрузка главы...</div>

<script>
fetch('chapter-01.txt')
  .then(response => {
    if (!response.ok) {
      throw new Error('Не удалось загрузить текст главы');
    }
    return response.text();
  })
  .then(text => {
    document.getElementById('chapter-text').textContent = text;
  })
  .catch(() => {
    document.getElementById('chapter-text').textContent =
      'Не удалось загрузить текст. Проверьте файл chapter-01.txt.';
  });
</script>

      <nav class="chapter-nav">
        <a href="chapters.html">← Все главы</a>
        <span>Следующая глава: скоро</span>
      </nav>

    </div>
  </main>

</body>
</html>
